"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Remember Me for agents<\u002Ftitle>\n\n\n\n<style>\n@font-face{font-family:\"PolySans\";src:url(\"36ea4c64-6fa8-42f3-9ff7-e8b610074664\") format(\"woff2\");font-weight:300;font-display:swap}\n@font-face{font-family:\"PolySans\";src:url(\"b5f171df-1243-490c-bd82-5af34048962f\") format(\"woff2\");font-weight:400;font-display:swap}\n@font-face{font-family:\"PolySans\";src:url(\"3ba4b54f-f17c-4052-8ba7-de23ec4e8350\") format(\"woff2\");font-weight:500;font-display:swap}\n@font-face{font-family:\"PolySans\";src:url(\"db46c0e1-162b-4442-8eda-6fc0ad6a1d92\") format(\"woff2\");font-weight:700;font-display:swap}\n@font-face{font-family:\"PolySans Wide\";src:url(\"a882a3b9-7ee1-4d8d-85f6-05df8adb8815\") format(\"woff2\");font-weight:300;font-display:swap}\n@font-face{font-family:\"PolySans Wide\";src:url(\"ec57cece-5e96-4e35-ac6b-04a0d5edaf9e\") format(\"woff2\");font-weight:500;font-display:swap}\n:root{\n  color-scheme:light;\n  --purple-50:#f3eefc;--purple-100:#ddcff2;--purple-200:#c7b0ec;--purple-300:#a680e6;--purple-500:#6700e5;--purple-600:#4e00b0;\n  --slate-50:#f2f3f7;--slate-100:#e9eaef;--slate-200:#e1e1e5;--slate-300:#bab9bb;--slate-500:#6e6d75;--slate-600:#55545b;--slate-700:#3d3c43;--slate-900:#1a1920;--slate-950:#07060d;\n  --emerald-50:#ecfdf5;--emerald-200:#a7f3d0;--emerald-500:#10b981;--emerald-700:#047857;\n  --orange-50:#fff7ed;--orange-200:#fed7aa;\n  --white:#ffffff;\n  --font-display:'PolySans',system-ui,sans-serif;\n  --font-wide:'PolySans Wide','PolySans',system-ui,sans-serif;\n  --font-mono:'PolySans',system-ui,sans-serif;\n}\n*{box-sizing:border-box}\nbody{background:var(--slate-50);color:var(--slate-950);font:15px/1.6 var(--font-display);margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.wrap{max-width:1360px;margin:0 auto;padding:40px 16px 64px;display:flex;flex-direction:column;g Me customer's agent check out at merchants that don't use Checkout.com, inside a budget the shopper approves. Checkout.com shares the saved card. The Open Money Stack vaults it and completes the checkout. <strong>Remember Me checkout for agents beyond the Checkout.com network, with a stablecoin balance for agent-native payments.<\u002Fstrong><\u002Fp>\n<\u002Fheader>\n\n<section class=\"panel\" aria-labelledby=\"val-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"val-h\">What it adds<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"split\">\n    <div class=\"card hl\">\n      <h3>For Checkout.com<\u002Fh3>\n      <ul>\n        <li>Remember Me works at merchants that don't use Checkout.com, as well as those that do<\u002Fli>\n        <li>Works with the cards Remember Me already vaults<\u002Fli>\n        <li>A stored balance in Remember Me, held in the shopper's own wallet<\u002Fli>\n        <li>A second rail: stablecoin payments where cards don't fit<\u002Fli>\n        <li>Acquiring revenue on top-up charges, and on agent purchases at Checkout.com merchants<\u002Fli>\n        <li>Keeps the customer relationship, identity, and saved cards<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"stack\">\n    <div class=\"card\">\n      <h3>For shoppers<\u002Fh3>\n      <p>One approval per merchant, with an amount the agent can't go past. Paid with the card they already use.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h3>For merchants<\u002Fh3>\n      <p>Agent purchases arrive as ordinary card payments with standard chargeback rights, through the integration they already have, whichever processor they use. Stablecoin payments are there for merchants that prefer them.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"panel\" aria-labelledby=\"run-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"run-h\">How it runs<\u002Fh2>\n    <p>The shopper approves the agent for two merchants. At Summit Gear, a store that doesn't use Checkout.com, OMS pays with the saved card through the Agent Vault, charged at the store. For Mapline, where a card doesn't fit, one $20 charge tops up the balance and the agent pays in stablecoins.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"rfd\" id=\"rfd\" role=\"img\" aria-label=\"Remember Me after the agent paid twice, each time inside an approval for one merchant. Trail shoes for $84 at Summit Gear, a store that does not use Checkout.com, were paid with the shopper's saved card, which Checkout.com shares and OMS vaults, through the browser and the Agent Vault. For Mapline, one $20 charge on the card topped up the balance, and trail maps for $2.40 were paid in stablecoins, leaving $17.60. The checkout API checked both payments and picked the rail for each.\"><\u002Fdiv>\n<script>\n(function(){\nvar root=document.getElementById('rfd');if(!root)return;\nvar D={\"css\": \"@layer stageshow{\\n.ss-fit { position: relative; width: 100%; margin-inline: auto; }\\n.ss-stage { --ss-canvas: #f6f5f4; --ss-surface: #fff; --ss-chrome: #fff; --ss-ink-1: rgba(0, 0, 0, 0.04); --ss-ink-2: rgba(0, 0, 0, 0.06); --ss-ink-3: rgba(0, 0, 0, 0.08); --ss-fill: #ebebeb; --ss-ink-4: rgba(0, 0, 0, 0.1); --ss-ink-5: rgba(0, 0, 0, 0.15); --ss-line: rgba(0, 0, 0, 0.06); --ss-line-faint: rgba(0, 0, 0, 0.04); --ss-text: #7a7a7d; --ss-text-strong: #262628; --ss-text-faint: #9a9a9d; --ss-icon: #707074; --ss-icon-faint: #c4c4c7; --ss-accent: #6700e5; --ss-accent-soft: rgba(59, 130, 246, 0.12); --ss-success: #22c55e; --ss-danger: #ef4444; --ss-warning: #f59e0b; --ss-well: #efeeec; --ss-success-soft: rgba(34, 197, 94, 0.12); --ss-success-text: #15803d; --ss-danger-soft: rgba(239, 68, 68, 0.1); --ss-danger-text: #b91c1c; --ss-warning-soft: rgba(245, 158, 11, 0.14); --ss-warning-text: #b45309; --ss-accent-2: #8b5cf6; --ss-accent-text: color-mix(in srgb, var(--ss-accent) 82%, #000); --ss-shadow-window: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.08); --ss-shadow-float: 0 0 0 1px rg  stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-landmark\\\"><line x1=\\\"3\\\" x2=\\\"21\\\" y1=\\\"22\\\" y2=\\\"22\\\"><\\/line><line x1=\\\"6\\\" x2=\\\"6\\\" y1=\\\"18\\\" y2=\\\"11\\\"><\\/line><line x1=\\\"10\\\" x2=\\\"10\\\" y1=\\\"18\\\" y2=\\\"11\\\"><\\/line><line x1=\\\"14\\\" x2=\\\"14\\\" y1=\\\"18\\\" y2=\\\"11\\\"><\\/line><line x1=\\\"18\\\" x2=\\\"18\\\" y1=\\\"18\\\" y2=\\\"11\\\"><\\/line><polygon points=\\\"12 2 20 7 4 7\\\"><\\/polygon><\\/svg><\\/span><span class=\\\"rf-head__text\\\"><strong>Charged at the merchant<\\/strong><span>An ordinary card payment<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\">Network token<\\/span><span class=\\\"rf-chip\\\">Browser checkout<\\/span><\\/div><\\/div><div class=\\\"rf-box\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--purple\\\"><svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"15\\\" height=\\\"15\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-lock\\\"><rect width=\\\"18\\\" height=\\\"11\\\" x=\\\"3\\\" y=\\\"11\\\" rx=\\\"2\\\" ry=\\\"2\\\"><\\/rect><path d=\\\"M7 11V7a5 5 0 0 1 10 0v4\\\"><\\/path><\\/svg><\\/span><span class=\\\"rf-head__text\\\"><strong>Routed per payment<\\/strong><span>OMS picks card or stablecoin<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\">Path A<\\/span><span class=\\\"rf-chip\\\">Path B<\\/span><span class=\\\"rf-chip\\\">Path C<\\/span><\\/div><\\/div><\\/div><\\/div><\\/div><\\/div><\\/div>\"};\nvar st=document.createElement('style');st.textContent=D.css;root.appendChild(st);\nvar h=document.createElement('div');h.className='rfd-stage';h.innerHTML=D.html;root.appendChild(h);\nvar W=1120,H=624;\nfunction fit(){var cw=root.clientWidth;var s=Math.min(cw/W,1.25);h.style.transform='translateX('+Math.max(0,(cw-W*s)/2)+'px) scale('+s+')';root.style.height=(H*s)+'px';}\nfit();if(window.ResizeObserver)new ResizeObserver(fit).observe(root);else window.addEventListener('resize',fit);\n})();\n<\u002Fscript>\n<\u002Fsection>\n\n<section class=\"panel break\" aria-labelledby=\"sys-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"sys-h\">How it works<\u002Fh2>\n    <p>Agent payments have two legs. The shopper funds the agent with what they already trust, usually a card. The agent then pays each merchant with whatever works best there: card or stablecoins. Remember Me stays the front door. Checkout.com shares the saved card, the Open Money Stack (OMS) vaults it, and the agent can check out at merchants that don't use Checkout.com. A stablecoin balance sits on top, and OMS picks card or stablecoin for each payment.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"diagram\" tabindex=\"0\" role=\"region\" aria-label=\"Architecture diagram, scrolls sideways on small screens\">\n  <svg viewBox=\"0 0 1000 646\" role=\"img\" aria-labelledby=\"d-t d-d\">\n    <title id=\"d-t\">Remember Me for agents: architecture<\u002Ftitle>\n    <desc id=\"d-d\">The shopper signs in to Remember Me and approves a budget for a merchant. Checkout.com shares the shopper's saved card and OMS stores it in the Agent Vault. OMS creates a user-held stablecoin balance at sign-up, topped up by one charge on the vaulted card. The agent sends a checkout request to the OMS checkout API, which checks the budget and routes each payment to one of three paths. Card payments charge the saved card at the merchant, with a network token at token-ready merchants or through an isolated OMS browser at web checkouts. Stablecoin payments come from the balance. All three paths work at merchants on or off the Checkout.com network.<\u002Fdesc>\n    <defs>\n      <marker id=\"m-s\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#6e6d75\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"m-p\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#6700e5\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"m-g\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#10b981\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n\n    <rect x=\"40\" y=\"16\" width=\"205\" height=\"60\" rx=\"10\" class=\"b-actor\"><\u002Frect>\n    <text x=\"56\" y=\"42\" class=\"t-label t-inv\">Shopper<\u002Ftext>\n    <text x=\"56\" y=\"63\" class=\"t-inv-s\">Signs in, approves a budget<\u002Ftext>\n    <rect x=\"715\" y=\"16\" width=\"205\" height=\"60\" rx=\"10\" class=\"b-actor\"><\u002Frect>\n    <text x=\"731\" y=\"42\" class=\"t-label t-inv\">Agent<\u002Ftext>\n    <text x=\"731\" y=\"63\" class=\"t-inv-s\">Pays inside the budget<\u002Ftext>\n\n    <rect x=\"20\" y=\"100\" width=\"920\" height=\"124\" rx=\"12\" class=\"b-band-cko\"><\u002Frect>\n    <text x=\"922\" y=\"123\" class=\"t-band s\" text-anchor=\"end\">Checkout.com Remember Me<\u002Ftext>\n    <rect x=\"40\" y=\"134\" width=\"205\" height=\"72\" rx=\"8\" class=\"b-cko\"><\u002Frect>\n    <text x=\"56\" y=\"162\" class=\"t-label\">Saved cards<\u002Ftext>\n    <text x=\"56\" y=\"184\" class=\"t-small\">In the existing vault<\u002Ftext>\n    <rect x=\"265\" y=\"134\" width=\"205\" height=\"72\" rx=\"8\" class=\"b-cko\"><\u002Frect>\n    <text x=\"281\" y=\"162\" class=\"t-label\">Identity<\u002Ftext>\n    <text x=\"281\" y=\"184\" class=\"t-small\">Email and one-time code<\u002Ftext>\n    <rect x=\"490\" y=\"134\" width=\"205\" height=\"72\" rx=\"8\" class=\"b-cko\"><\u002Frect>\n    <text x=\"506\" y=\"162\" class=\"t-label\">Saved addresses<\u002Ftext>\n    <text x=\"506\" y=\"184\" class=\"t-small\">Used at checkout<\u002Ftext>\n    <rect x=\"715\" y=\"134\" width=\"205\" height=\"72\" rx=\"8\" class=\"b-oms-hl\"><\u002Frect>\n    <text x=\"731\" y=\"162\" class=\"t-label\">Budget and approvals<\u002Ftext>\n    <text x=\"731\" y=\"184\" class=\"t-small\">Hosted by OMS<\u002Ftext>\n    <path d=\"M142 76 V130\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n\n    <rect x=\"20\" y=\"250\" width=\"920\" height=\"114\" rx=\"12\" class=\"b-band-oms\"><\u002Frect>\n    <text x=\"38\" y=\"273\" class=\"t-band p\">Open Money Stack<\u002Ftext>\n    <rect x=\"40\" y=\"284\" width=\"205\" height=\"64\" rx=\"8\" class=\"b-vgs\"><\u002Frect>\n    <text x=\"56\" y=\"310\" class=\"t-label\">Agent Vault<\u002Ftext>\n    <text x=\"56\" y=\"332\" class=\"t-small\">Run by OMS<\u002Ftext>\n    <rect x=\"335\" y=\"284\" width=\"135\" height=\"64\" rx=\"8\" class=\"b-oms\"><\u002Frect>\n    <text x=\"351\" y=\"310\" class=\"t-label\">Balance<\u002Ftext>\n    <text x=\"351\" y=\"332\" class=\"t-small\">Shopper's wallet<\u002Ftext>\n    <rect x=\"490\" y=\"284\" width=\"430\" height=\"64\" rx=\"8\" class=\"b-oms-hl\"><\u002Frect>\n    <text x=\"506\" y=\"310\" class=\"t-label\">Checkout API<\u002Ftext>\n    <text x=\"506\" y=\"332\" class=\"t-small\">Checks the budget, picks card or stablecoin<\u002Ftext>\n\n    <path d=\"M200 206 V280\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n    <text x=\"208\" y=\"240\" class=\"t-edge\">saved card shared<\u002Ftext>\n    <path d=\"M402 206 V280\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n    <text x=\"410\" y=\"240\" class=\"t-edge\">wallet at sign-up<\u002Ftext>\n    <path d=\"M592 206 V280\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n    <text x=\"600\" y=\"240\" class=\"t-edge\">shipping<\u002Ftext>\n    <path d=\"M817 206 V280\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <text x=\"825\" y=\"240\" class=\"t-edge\">amount and merchant<\u002Ftext>\n    <path d=\"M245 316 H329\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <text x=\"290\" y=\"295\" class=\"t-edge\" text-anchor=\"middle\">debit card<\u002Ftext>\n    <text x=\"290\" y=\"308\" class=\"t-edge\" text-anchor=\"middle\">top-up<\u002Ftext>\n    <path d=\"M920 46 H968 V316 H926\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <text x=\"975\" y=\"130\" class=\"t-edge\" transform=\"rotate(90 975 130)\">checkout request<\u002Ftext>\n\n    <path d=\"M142 348 V484\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <path d=\"M142 404 H480 V484\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <text x=\"150\" y=\"398\" class=\"t-edge\">card, charged at the merchant<\u002Ftext>\n    <path d=\"M402 348 V384 H780 V484\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <text x=\"788\" y=\"378\" class=\"t-edge\">stablecoins<\u002Ftext>\n    <path d=\"M880 348 V484\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <path d=\"M880 456 H260 V484\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <path d=\"M580 456 V484\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <text x=\"888\" y=\"420\" class=\"t-edge\">routes<\u002Ftext>\n    <text x=\"888\" y=\"434\" class=\"t-edge\">each payment<\u002Ftext>\n\n    <rect x=\"40\" y=\"488\" width=\"280\" height=\"112\" rx=\"10\" class=\"b-rail\"><\u002Frect>\n    <rect x=\"56\" y=\"504\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"68\" y=\"521\" class=\"rail-key-t\" text-anchor=\"middle\">A<\u002Ftext>\n    <text x=\"90\" y=\"522\" class=\"t-label\">Token-ready merchant<\u002Ftext>\n    <text x=\"56\" y=\"556\" class=\"t-small\">OMS tokenizes the vaulted card.<\u002Ftext>\n    <text x=\"56\" y=\"576\" class=\"t-small\">Pays without a browser session.<\u002Ftext>\n\n    <rect x=\"340\" y=\"488\" width=\"280\" height=\"112\" rx=\"10\" class=\"b-rail\"><\u002Frect>\n    <rect x=\"356\" y=\"504\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"368\" y=\"521\" class=\"rail-key-t\" text-anchor=\"middle\">B<\u002Ftext>\n    <text x=\"390\" y=\"522\" class=\"t-label\">Web checkout<\u002Ftext>\n    <rect x=\"356\" y=\"540\" width=\"72\" height=\"44\" rx=\"6\" class=\"b-oms\"><\u002Frect>\n    <text x=\"392\" y=\"559\" class=\"t-strong\" text-anchor=\"middle\">OMS<\u002Ftext>\n    <text x=\"392\" y=\"575\" class=\"t-small\" text-anchor=\"middle\">browser<\u002Ftext>\n    <path d=\"M428 562 H438\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n    <rect x=\"442\" y=\"540\" width=\"72\" height=\"44\" rx=\"6\" class=\"b-vgs\"><\u002Frect>\n    <text x=\"478\" y=\"559\" class=\"t-strong\" text-anchor=\"middle\">Agent<\u002Ftext>\n    <text x=\"478\" y=\"575\" class=\"t-small\" text-anchor=\"middle\">Vault<\u002Ftext>\n    <path d=\"M514 562 H524\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n    <rect x=\"528\" y=\"540\" width=\"76\" height=\"44\" rx=\"6\" class=\"b-cko\"><\u002Frect>\n    <text x=\"566\" y=\"567\" class=\"t-strong\" text-anchor=\"middle\">Merchant<\u002Ftext>\n\n    <rect x=\"640\" y=\"488\" width=\"280\" height=\"112\" rx=\"10\" class=\"b-rail\"><\u002Frect>\n    <rect x=\"656\" y=\"504\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"668\" y=\"521\" class=\"rail-key-t\" text-anchor=\"middle\">C<\u002Ftext>\n    <text x=\"690\" y=\"522\" class=\"t-label\">Stablecoin payment<\u002Ftext>\n    <text x=\"656\" y=\"556\" class=\"t-small\">Where cards don't fit: small amounts,<\u002Ftext>\n    <text x=\"656\" y=\"576\" class=\"t-small\">or merchants that prefer stablecoins.<\u002Ftext>\n    <text x=\"480\" y=\"628\" class=\"t-strong\" text-anchor=\"middle\">All three paths work at merchants on or off the Checkout.com network.<\u002Ftext>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"legend\">\n    <span><i class=\"sw cko\"><\u002Fi>Checkout.com<\u002Fspan>\n    <span><i class=\"sw oms\"><\u002Fi>Open Money Stack<\u002Fspan>\n    <span><i class=\"sw vgs\"><\u002Fi>Agent Vault<\u002Fspan>\n    <span><i class=\"ln money\"><\u002Fi>Money<\u002Fspan>\n    <span><i class=\"ln ctrl\"><\u002Fi>Agent request and control<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"facts\">\n    <div><h3>How the money moves<\u002Fh3><p>The shopper approves a budget once per merchant. Card payments charge the saved card at the merchant and settle like any other card payment. For stablecoin payments, the shopper tops up their own wallet before the purchase, by card, bank transfer, or crypto transfer, and what's left stays scoped to that merchant. The shopper's approval gives the agent a scoped permission to spend from the wallet, so OMS can only move funds inside it.<\u002Fp><\u002Fdiv>\n    <div><h3>Card or stablecoin, picked per payment<\u002Fh3><p>OMS checks every payment against the budget, then picks the rail. The merchant doesn't need to be on Checkout.com for any of them. Card where the merchant takes cards: a network token first, browser checkout otherwise. Stablecoins where a card doesn't fit: small amounts, or merchants that prefer them. Anything outside the budget, or a 3-D Secure step-up from the card issuer, goes to the shopper first.<\u002Fp><\u002Fdiv>\n    <div><h3>Card data stays in the Agent Vault<\u002Fh3><p>Checkout.com shares the shopper's saved Remember Me card with the Agent Vault, and OMS tokenizes it with the card network. The agent never sees a card number, and each web checkout runs in its own short-lived, isolated browser session.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"panel\" aria-labelledby=\"next-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"next-h\">Next steps<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"two\">\n    <div class=\"card hl\">\n      <h3>Proposed: a joint sandbox demo<\u002Fh3>\n      <ol>\n        <li>Remember Me sign-up creates a user-held balance<\u002Fli>\n        <li>Checkout.com shares a saved test card and OMS vaults it<\u002Fli>\n        <li>Shopper approves a budget for a web store that doesn't use Checkout.com, and the agent buys there by card through the OMS secure browser (path B)<\u002Fli>\n        <li>Shopper approves a top-up for a second merchant, and the agent pays in stablecoins (path C)<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h3>To align on<\u002Fh3>\n      <ul>\n        <li>How saved Remember Me cards reach the Agent Vault, and the consent the shopper gives<\u002Fli>\n        <li>OIDC token issued for Remember Me<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"fallback\">Later, if Checkout.com adds consumer issuing for Remember Me users, an issued card can let the balance pay at card merchants too.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>"
